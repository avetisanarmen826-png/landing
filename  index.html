<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      gap: 16px;
    }
    .label {
      color: #666;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .banner-frame {
      border: 1px dashed #444;
      position: relative;
      background: #111;
    }
    .banner-frame::before {
      content: 'Loading banner...';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 12px;
      z-index: 0;
    }
    .banner-frame > * {
      position: relative;
      z-index: 1;
    }
    .status {
      color: #555;
      font-size: 11px;
      margin-top: 8px;
      text-align: center;
      max-width: 320px;
      line-height: 1.6;
    }
    .status .ok { color: #4caf50; font-weight: bold; }
    .status .err { color: #f44336; font-weight: bold; }
    .status .warn { color: #ff9800; font-weight: bold; }
  </style>

  <!-- Движок Onclicka -->
  <script async
    src="https://js.onclckmn.com/static/onclicka.js"
    data-admpid="286465">
  </script>
</head>
<body>

  <div class="label">Banner preview — 300×250</div>

  <div class="banner-frame" style="width:300px; height:250px;">
    <div data-banner-id="6055613"></div>
  </div>

  <div class="status" id="status">Status: waiting...</div>

  <script>
    var script = document.querySelector('script[data-admpid]');
    var statusEl = document.getElementById('status');

    script.addEventListener('load', function() {
      statusEl.innerHTML = 'Status: <span class="ok">script loaded ✓</span> — waiting for ad fill...';
    });

    script.addEventListener('error', function() {
      statusEl.innerHTML =
        'Status: <span class="err">script failed to load ✗</span><br>' +
        'Open via local server:<br>' +
        '<code style="color:#aaa">python3 -m http.server 8080</code><br>' +
        'then go to <code style="color:#aaa">http://localhost:8080</code>';
    });

    setTimeout(function() {
      var container = document.querySelector('[data-banner-id]');
      var hasContent = container && container.children.length > 0;
      if (hasContent) {
        statusEl.innerHTML = 'Status: <span class="ok">banner loaded successfully ✓</span>';
      } else {
        statusEl.innerHTML =
          'Status: <span class="warn">script ok, but no ad fill ⚠</span><br>' +
          'Zone may have no demand right now — try again later or check zone ID in Onclicka panel';
      }
    }, 3000);
  </script>

</body>
</html>
