<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Updates</title>
</head>
<body>
  <div id="ad-slot"></div>

  <script>
    var params = new URLSearchParams(window.location.search);ы
    var siteId = params.get('utm_source') || params.get('siteid') || '';

    var div = document.createElement('div');
    div.setAttribute('data-banner-id', '6119720');
    if (siteId) {
      div.setAttribute('data-sub', siteId);
    }
    document.getElementById('ad-slot').appendChild(div);

    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://js.onclckmn.com/static/onclicka.js';
    s.setAttribute('data-admpid', '441714');
    document.head.appendChild(s);
  </script>
</body>
</html>
